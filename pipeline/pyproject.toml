[project]
name = "charter990"
version = "0.1.0"
description = "Links US charter schools to the nonprofits that file their IRS Form 990"
authors = [
    { name = "peterhyland0", email = "Peterhyland101210@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster==1.13.27",
    "dagster-webserver==1.13.27",
    "inflate64>=1.0.4",
    "lxml==6.1.3",
    "psycopg[binary]==3.3.6",
    "remotezip==0.12.6",
    "requests>=2.34.2",
    "tldextract==5.4.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.dagster]
module_name = "charter990.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
